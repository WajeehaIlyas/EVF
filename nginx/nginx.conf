# AEVAF reverse proxy (runs as an unprivileged user; listens on 8080 inside the container).
#
#   /                  -> frontend  (Next.js)
#   /api/              -> backend   (FastAPI)
#   /ws/, /api/v1/ws/  -> backend   (WebSockets)
#   /media/*.jpg|png   -> served straight from the shared media volume
#
# Containers are addressed by service name through Docker's DNS (127.0.0.11). Using variables in
# proxy_pass makes nginx re-resolve them, so recreating the backend/frontend never leaves nginx
# pointing at a stale IP.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # writable locations for a read-only container filesystem
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- limits
    client_max_body_size    100M;
    client_body_buffer_size 128k;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=50r/s;
    limit_req_status 429;

    # ---- Docker DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ---- helpers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    # keep the scheme set by an upstream TLS terminator, if there is one
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # ---- compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        # Security headers. (Do not add add_header inside locations below: that would drop these.)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- liveness probes
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /healthz {                      # API + database check, for external monitors
            access_log off;
            set $backend_health http://backend:8000/health;
            proxy_pass $backend_health;
        }

        location ~ /\.(?!well-known) {              # never serve dotfiles
            deny all;
        }

        # ---- upload staging area is never public (^~ beats the image rule below)
        location ^~ /media/_uploads/ {
            return 404;
        }

        # ---- event images: static files from the shared volume (mounted read-only at /srv/media)
        location ~* ^/media/.+\.(?:jpe?g|png)$ {
            root /srv;
            try_files $uri =404;
            expires 30d;
            access_log off;
        }
        location /media/ {                          # package JSON etc. is not public
            return 404;
        }

        # ---- WebSockets (live ingestion progress). The backend route is /ws/ingest-progress/{job};
        #      /api/v1/ws/... is accepted as an alias and rewritten to it.
        location /ws/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/v1/ws/ {
            rewrite ^/api/v1/ws/(.*)$ /ws/$1 break;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ---- file uploads from the Import page: stream straight to the backend, no disk buffering
        # Regex (not a prefix ending in '/'): a slash-terminated prefix makes nginx answer
        # POST /api/v1/imports with a 301 redirect, which browsers turn into a GET.
        location ~ ^/api/v1/imports(?:/|$) {
            limit_req zone=api_per_ip burst=100 nodelay;
            client_max_body_size 100M;
            proxy_request_buffering off;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 900s;           # finishing an import can take a while
            proxy_send_timeout 900s;
        }

        # ---- REST API
        location /api/ {
            limit_req zone=api_per_ip burst=100 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;            # Google Sheets exports and large local ingests
            proxy_send_timeout 300s;
        }

        # ---- Next.js build output: content-hashed file names, so the app already sends
        #      "Cache-Control: public, max-age=31536000, immutable"; it is passed through unchanged.
        location /_next/static/ {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            access_log off;
        }

        # ---- everything else: the web app
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # ---- optional hardening (uncomment) ---------------------------------------------------
        # The API has no login yet. Until it does, protect the whole site, e.g. with HTTP basic auth
        # (create the file with:  htpasswd -c nginx/.htpasswd reviewer  and mount it read-only):
        #   auth_basic           "AEVAF";
        #   auth_basic_user_file /etc/nginx/.htpasswd;
        # For HTTPS, terminate TLS in front of this container (Caddy, Traefik, a cloud load
        # balancer) and keep forwarding X-Forwarded-Proto; the app honours it.
    }
}
