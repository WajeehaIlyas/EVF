[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evf-backend"
version = "0.1.0"
description = "Automated Event Validation & Analytics Framework - backend service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.7",          # [email] provides EmailStr validation
    "pydantic-settings>=2.2",        # BaseSettings lives here in Pydantic v2
    "paramiko>=3.4",
    "gspread>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.3",
    # Declared now because the project layout uses them in later phases:
    "redis>=5.0",
    "celery[redis]>=5.3",
    "watchdog>=4.0",
    "python-multipart>=0.0.9",   # file uploads (Import page)
    "tzdata>=2024.1",            # time-zone database for the slim Docker image
    "openpyxl>=3.1",             # Analytics page: import a labelled .xlsx
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
